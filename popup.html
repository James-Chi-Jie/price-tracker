<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>多平台低价预警</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>多平台低价预警</h1>
      <form id="monitor-form">
        <label>
          监控平台
          <select id="platform">
            <option value="jd">京东</option>
            <option value="taobao">淘宝</option>
            <option value="tmall">天猫</option>
          </select>
        </label>
        <label>
          商品关键词（用于搜索）
          <input id="keyword" type="text" placeholder="例如：索尼 WH-1000XM5" required>
        </label>
        <button type="submit">搜索商品并设置规则</button>
      </form>
      <p id="message" class="message"></p>
      <section>
        <h2>监控列表</h2>
        <div id="monitors" class="monitors"></div>
      </section>
      <p class="hint">先输入品名搜索；目标价格和价格计算方式会在下一页一起设置。之后每 30 分钟检查一次，请保持 Chrome 开启且电脑不要休眠。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
