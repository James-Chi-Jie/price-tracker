<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>京东低价预警</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>京东低价预警</h1>
      <form id="monitor-form">
        <label>
          商品关键词（用于搜索）
          <input id="keyword" type="text" placeholder="例如：索尼 WH-1000XM5" required>
        </label>
        <label>
          目标价格（低于此价提醒）
          <input id="threshold" type="number" min="0.01" step="0.01" placeholder="100" required>
        </label>
        <button type="submit">搜索并选择商品</button>
      </form>
      <p id="message" class="message"></p>
      <section>
        <h2>监控列表</h2>
        <div id="monitors" class="monitors"></div>
      </section>
      <p class="hint">品名和价格只需在这里填写一次；选择页会沿用这两个条件。之后每 30 分钟检查一次，请保持 Chrome 开启且电脑不要休眠。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
