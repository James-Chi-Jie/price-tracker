<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>选择要监控的京东商品</title>
    <link rel="stylesheet" href="select.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>定义要监控的商品类型</h1>
          <p id="summary" class="muted">正在加载搜索结果…</p>
        </div>
        <button id="select-low" class="secondary" type="button">全选低于阈值</button>
      </header>
      <section class="rule-box">
        <h2>从本次搜索结果中选择条件</h2>
        <p class="field-hint">产品名沿用入口填写的内容。下面选择剂型、剂量规格、单包装数量和盒数；某一组不选择表示不限。</p>
        <div id="dosage-options" class="option-group"></div>
        <div id="strength-options" class="option-group"></div>
        <div id="unit-options" class="option-group"></div>
        <div id="pack-options" class="option-group"></div>
        <label>
          排除的关键词（可选）
          <input id="exclude-keywords" type="text" placeholder="例如：膜 栓">
        </label>
        <label>
          价格计算方式
          <select id="price-basis">
            <option value="total">按商品总价</option>
            <option value="perBox">按平均每盒价格</option>
            <option value="perUnit">按平均每个单位价格</option>
          </select>
        </label>
        <div class="threshold-section">
          <div class="threshold-heading">目标价格（比较价低于对应值时提醒）</div>
          <div id="thresholds" class="threshold-list"></div>
          <p id="threshold-hint" class="field-hint">系统会按识别出的规格组合分别设置目标价格。</p>
        </div>
        <p class="field-hint">商品标题包含任意排除词时，不会参与监控；下方搜索结果和链接会随条件联动筛选；某类只有一个候选项时会自动选择。</p>
      </section>
      <h2 class="section-title">搜索结果预览</h2>
      <div class="toolbar">
        <button id="select-all" class="secondary" type="button">全选预览商品</button>
        <button id="clear-all" class="secondary" type="button">清空预览选择</button>
        <span id="selected-count" class="muted">预览选择不是监控范围</span>
      </div>
      <section id="products" class="products"></section>
      <p id="message" class="message"></p>
      <button id="confirm" class="confirm" type="button">按这些条件创建监控</button>
      <p class="hint">监控范围由产品名和上面的属性条件决定，不是预览商品的 SKU。当前读取京东搜索结果第一页。</p>
    </main>
    <script src="select.js"></script>
  </body>
</html>
